<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dietetics Isles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>html,body{height:100%;margin:0;overflow:hidden}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: full-bleed 3D sea of islands; floating frosted cards (brand+search top-left, time top-right, legend bottom-left, reading panel right / bottom sheet on phones) */
:root{
  --bg:#BFDCEB;
  --panel:rgba(250,251,248,.93);
  --panel-solid:#FAFBF8;
  --ink:#1D2A2E;
  --r-who:#EEF2F3;--r-who-ink:#1D2A2E;--r-plea:#FFF4DC;--r-plea-ink:#3A2A08;--r-plea-bd:#E6A23C;--r-opt:#FFFFFF;--r-opt-ink:#1D2A2E;--r-opt-bd:#CDD3D1;--r-opt-hov:#F2F4F1;--r-dim:#4E585B;--r-ok:#E3F2E4;--r-ok-ink:#1B5E20;--r-ok-bd:#2E7D32;--r-bad:#FBE4E4;--r-bad-ink:#B71C1C;--r-bad-bd:#C62828;--r-good:#EAF5EA;--r-nope:#FCEDED;--r-why-ink:#1D2A2E;--r-hit:#FFF0B8;--r-hit-ink:#3A2A08;--r-pill:#FFF0B8;--r-pill-ink:#6B4600;--r-btn:#FDE3E3;--r-btn-ink:#A31515;
  --muted:#5A6B6F;
  --line:rgba(29,42,46,.13);
  --chip:#EEF2EE;
  --chip-hover:#E2E9E3;
  --accent:#B23548;
  --accent-soft:rgba(178,53,72,.10);
  --collab:#2B8A66;
  --conflict:#D2602F;
  --exam-bg:#FFF4D9;
  --exam-ink:#6B4A06;
  --shadow:0 10px 30px rgba(20,40,50,.16);
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --f-mono:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A2236;--panel:rgba(22,28,34,.92);--panel-solid:#161C22;--ink:#E7EDEB;--muted:#9AABAE;--line:rgba(231,237,235,.13);
  --chip:#232C33;--chip-hover:#2C3740;--accent:#F0798A;--accent-soft:rgba(240,121,138,.14);--collab:#5CC79C;--conflict:#F2925F;
  --exam-bg:#3A2F14;--exam-ink:#F3D58C;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;--r-who:#24323B;--r-who-ink:#F1F5F4;--r-plea:#3B3019;--r-plea-ink:#FBEFD2;--r-plea-bd:#E6A23C;--r-opt:#1F2930;--r-opt-ink:#F1F5F4;--r-opt-bd:#45535C;--r-opt-hov:#2A363F;--r-dim:#B9C4C7;--r-ok:#1D3B25;--r-ok-ink:#B6EBBE;--r-ok-bd:#4CAF50;--r-bad:#41201F;--r-bad-ink:#FFC2C2;--r-bad-bd:#E57373;--r-good:#1E3326;--r-nope:#3B2323;--r-why-ink:#F1F5F4;--r-hit:#4A3D12;--r-hit-ink:#FFE9A8;--r-pill:#4A3D12;--r-pill-ink:#FFE9A8;--r-btn:#4A2222;--r-btn-ink:#FFC9C9;}}
:root[data-theme="dark"]{
  --bg:#1A2236;--panel:rgba(22,28,34,.92);--panel-solid:#161C22;--ink:#E7EDEB;--muted:#9AABAE;--line:rgba(231,237,235,.13);
  --chip:#232C33;--chip-hover:#2C3740;--accent:#F0798A;--accent-soft:rgba(240,121,138,.14);--collab:#5CC79C;--conflict:#F2925F;
  --exam-bg:#3A2F14;--exam-ink:#F3D58C;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;--r-who:#24323B;--r-who-ink:#F1F5F4;--r-plea:#3B3019;--r-plea-ink:#FBEFD2;--r-plea-bd:#E6A23C;--r-opt:#1F2930;--r-opt-ink:#F1F5F4;--r-opt-bd:#45535C;--r-opt-hov:#2A363F;--r-dim:#B9C4C7;--r-ok:#1D3B25;--r-ok-ink:#B6EBBE;--r-ok-bd:#4CAF50;--r-bad:#41201F;--r-bad-ink:#FFC2C2;--r-bad-bd:#E57373;--r-good:#1E3326;--r-nope:#3B2323;--r-why-ink:#F1F5F4;--r-hit:#4A3D12;--r-hit-ink:#FFE9A8;--r-pill:#4A3D12;--r-pill-ink:#FFE9A8;--r-btn:#4A2222;--r-btn-ink:#FFC9C9;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.hovering{cursor:pointer}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* brand + search */
#brand{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px));width:min(320px,calc(100% - 32px));padding:14px 16px 12px;z-index:5}
#brand .kicker{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
#brand h1{font-family:var(--f-display);font-size:26px;font-weight:700;margin:2px 0 2px;letter-spacing:.02em;text-wrap:balance}
#brand h1 span{color:var(--accent)}
#brand .src{font-size:12px;color:var(--muted);margin:0 0 10px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:10px;padding:9px 12px 9px 34px}
.search input:focus{outline:none;border-color:var(--accent);background:var(--panel-solid)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
#results{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
#results button{all:unset;box-sizing:border-box;width:100%;display:block;padding:7px 10px;border-radius:8px;cursor:pointer}
#results button:hover,#results button:focus-visible{background:var(--chip-hover)}
#results b{font-weight:700;font-size:14px}
#results small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .none{color:var(--muted);font-size:13px;padding:6px 10px}

/* time */
#hudR{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#tsRow{display:flex;gap:6px;align-items:stretch}
#bgmBtn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:42px;border-radius:14px;color:var(--ink);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
#bgmBtn svg{width:17px;height:17px}
#bgmBtn[aria-pressed="true"]{color:#962B3C}
#timeseg{display:flex;padding:4px;gap:2px}
#timeseg button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);padding:6px 10px;border-radius:8px}
#timeseg button svg{width:15px;height:15px}
#timeseg button:hover{background:var(--chip-hover)}
#timeseg button[aria-pressed="true"]{background:#1D2A2E;color:#fff}
#timeseg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#mmWrap{padding:6px;line-height:0}
#minimap{width:180px;height:180px;border-radius:10px;cursor:pointer;display:block}
body.fp #reopen{top:262px}
.with-panel #hudR{right:calc(max(16px,env(safe-area-inset-right,0px)) + max(396px,calc(min(460px,40vw) + 16px)))}

/* legend (inside overview panel) */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:26px;height:0;border-top:3px solid}
.legend .c{border-color:var(--collab)}
.legend .x{border-top-style:dashed;border-color:var(--conflict)}
.legend .n{width:14px;height:14px;border:none;border-radius:3px;background:var(--chip);outline:1px dashed var(--muted)}
kbd{font-family:var(--f-mono);font-size:11.5px;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* roster */
#roster{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;width:min(290px,calc(100% - 32px));overflow:hidden}
#rosterHead{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-size:14px}
#rosterHead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:14px}
#rosterHead .chev{margin-left:auto;font-size:12px;color:var(--muted)}
.live{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.live.on{background:var(--collab);box-shadow:0 0 0 3px rgba(43,138,102,.22)}
#rosterBody{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px;max-height:44vh;overflow:auto}
.rowctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.rowctl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.chip.on{background:var(--exam-bg);color:var(--exam-ink)}
#rosterList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
#rosterList button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
#rosterList button:hover,#rosterList button:focus-visible{background:var(--chip-hover)}
#rosterList .sw{width:10px;height:10px;border-radius:50%;flex:none}
#rosterList .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rosterList .where{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.handmark{color:var(--exam-ink);background:var(--exam-bg);font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}
#roomNote{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.here{font-size:13.5px;line-height:1.7}
/* labels v3 */
.lbl.sm{font-size:11px;font-weight:400;padding:2px 7px;background:rgba(255,255,255,.78);box-shadow:none}
.lbl.main{font-size:13px;font-weight:700;padding:4px 10px}
.sec.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
/* sections */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.toc .chip{font-size:12.5px;padding:5px 9px}
.sec{scroll-margin-top:8px}
.tbl.wrap th,.tbl.wrap td{white-space:normal;min-width:4.5em;vertical-align:top}
.tbl.wrap td.n{white-space:nowrap}
.readst .prog{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.readst .prog i{font-style:normal}
.readst .prog i.ok{color:var(--collab);font-weight:500}
/* stars */
.stars{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.stars .meter{flex:1;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.stars .meter i{display:block;height:100%;width:0;background:#E2A93B;border-radius:inherit;transition:width .5s ease}
.stars b{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.star{color:#D99A1E}
.readst{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:9px 12px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--muted)}
.readst.done{background:var(--exam-bg);color:var(--exam-ink)}
.readst .bar{height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.readst .bar i{display:block;height:100%;width:0;background:#E2A93B;animation:fill 8s linear forwards}
@keyframes fill{to{width:100%}}
.lbl.done::before{content:"★ ";color:#D99A1E}

/* greetings */
#greet{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:6px;padding:6px;align-items:center}
#greet button{all:unset;box-sizing:border-box;cursor:pointer;font-size:13.5px;padding:8px 12px;border-radius:10px;white-space:nowrap;display:flex;gap:6px;align-items:center}
#greet button:hover,#greet button:focus-visible{background:var(--chip-hover)}
#greet button[aria-pressed="true"]{background:#1D2A2E;color:#fff}
#dpad{position:absolute;right:16px;bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
#dpad button{all:unset;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.82);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:18px;color:#1D2A2E}
#dpad button:active{background:#1D2A2E;color:#fff}
#dpad [data-k=u]{grid-column:2;grid-row:1}#dpad [data-k=tl]{grid-column:1;grid-row:2}#dpad [data-k=d]{grid-column:2;grid-row:2}#dpad [data-k=tr]{grid-column:3;grid-row:2}
#fpHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:3;font-size:12px;color:#fff;background:rgba(29,42,46,.62);padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none}
@media (pointer:coarse){#fpHint{display:none}}
#greet button:focus-visible{outline:2px solid var(--accent)}
#greet kbd{font-size:10.5px}
#greet button[disabled]{opacity:.45;cursor:default}
.with-panel #greet{left:calc(50% - 198px)}
.lbl.bubble{font-size:13px;font-weight:500;background:#fff;color:#1D2A2E;border-radius:12px;padding:6px 11px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
.lbl.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
@media (max-width:1100px){.with-panel #greet{left:50%}}
@media (max-width:760px){#greet{bottom:calc(66px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));transform:none}#greet kbd{display:none}#greet button{padding:8px 9px;font-size:13px}#roster{width:calc(100% - 172px)}#roster #rosterHead .chev{display:none}.roster-open #greet{display:none}}

/* login */
#login{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(18,30,40,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
#loginForm{width:min(380px,100%);box-sizing:border-box;padding:24px 22px 20px;display:flex;flex-direction:column;gap:14px}
#loginForm .kicker{font-size:11px;letter-spacing:.14em;color:var(--muted)}
#loginForm h2{font-family:var(--f-display);font-size:28px;margin:0;line-height:1.2}
#loginForm h2 span{color:var(--accent)}
#loginForm p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}
#loginForm label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
#loginForm input{box-sizing:border-box;width:100%;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:10px;padding:10px 12px}
#loginForm input:focus{outline:none;border-color:var(--accent);background:var(--panel-solid)}
#loginForm .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
#loginForm .go{all:unset;box-sizing:border-box;text-align:center;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:11px;border-radius:10px}
#loginForm .go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#loginForm .row{display:flex;justify-content:space-between;align-items:center}
#loginErr{min-height:1.2em;font-size:13px;color:var(--accent)}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:8;padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* panel */
#panel{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(460px,40vw);min-width:380px;z-index:5;display:flex;flex-direction:column;overflow:hidden;transition:transform .35s ease,opacity .35s ease}
#panel.closed{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
#panel header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 0 16px}
#panel header button{all:unset;cursor:pointer;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px}
#panel header button:hover,#panel header button:focus-visible{background:var(--chip);color:var(--ink)}
#pbody{overflow:auto;padding:4px 20px 22px;min-height:0}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.eyebrow.collab{color:var(--collab)}.eyebrow.conflict{color:var(--conflict)}
#pbody h2{font-family:var(--f-display);font-size:28px;margin:4px 0 0;line-height:1.25;text-wrap:balance}
#pbody .en{font-size:13px;color:var(--muted);margin:2px 0 14px;font-style:italic}
#pbody p{line-height:1.7;font-size:14.5px;margin:0 0 12px}
#pbody h3{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:20px 0 8px;font-weight:500}
ul.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.pts li{position:relative;padding-left:16px;line-height:1.7;font-size:14.5px}
ul.pts li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.pts b{font-weight:700}
.sbp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin:2px 0 6px}
.sbp div{background:var(--accent-soft);padding:10px 12px}
.sbp small{display:block;font-size:11.5px;color:var(--muted)}
.sbp strong{font-family:var(--f-mono);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.sbp strong em{font-style:normal;font-size:12px;margin-left:2px}
.sbpnote{font-size:11.5px;color:var(--muted);margin:0 0 4px}
.tbl{overflow-x:auto;margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.06em}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
td.op{color:var(--muted);font-size:12px}
#scene{transition:filter .6s ease}#scene.dayvivid{filter:saturate(1.26) sepia(.12) contrast(1.07) brightness(.95)}#scene.nightvivid{filter:saturate(1.08) contrast(1.1)}
#insCard{position:absolute;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:7;width:min(360px,calc(100vw - 32px));padding:12px 16px;font-size:14px;color:var(--ink)}#insCard .ih{font-size:17px}
@media (max-width:760px){#insCard{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.lbl.arrowlbl{background:rgba(70,76,80,.55);color:#fff;font-weight:600}
.lbl.help{background:#C59A3C;color:#2B2418;font-weight:700;font-size:12.5px;animation:hb 1.2s ease-in-out infinite}
@keyframes hb{50%{box-shadow:0 0 0 6px rgba(197,154,60,.32)}}
@media (prefers-reduced-motion:reduce){.lbl.help{animation:none}}
.rescue{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;margin-top:6px;color:var(--ink)}.rescue b{color:var(--ink);font-weight:600;white-space:nowrap}.rescue .score,.rescue button{white-space:nowrap}
.rescue button{all:unset;cursor:pointer;margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--r-btn);color:var(--r-btn-ink)}.rescue button:hover{filter:brightness(.96)}
.who{font-size:14.5px;line-height:1.7;color:var(--r-who-ink);background:var(--r-who);border-radius:8px;padding:8px 12px;margin-top:8px}
.score{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--r-pill-ink);background:var(--r-pill);border-radius:999px;padding:1px 9px;font-size:12px}

/* districts: grow contiguous regions on the hex grid */
function assignDistricts(){
  const key=a=>a[0]+','+a[1];const owner=new Map();const region=B.map(()=>[]);
  if(!B.length)return {owner,region,key};
  const need=B.map(b=>1+b.secs.length);
  const pos=a=>axial(a[0],a[1]);
  const byR=GRID.slice().sort((x,y)=>hexDist(x,[0,0])-hexDist(y,[0,0])||Math.atan2(pos(x).z,pos(x).x)-Math.atan2(pos(y).z,pos(y).x));
  const n0=Math.min(need[0],GRID.length);byR.slice(0,n0).forEach(t=>{owner.set(key(t),0);region[0].push(t);});
  const rest=byR.slice(n0);const ang=t=>{let a=Math.atan2(pos(t).z,pos(t).x)+Math.PI/2;while(a<0)a+=Math.PI*2;return a%(Math.PI*2);};
  rest.sort((x,y)=>ang(x)-ang(y)||hexDist(x,[0,0])-hexDist(y,[0,0]));
  const totalNeed=need.slice(1).reduce((s,v)=>s+v,0)||1;let idx=0;
  for(let i=1;i<B.length;i++){
    const take=i===B.length-1?rest.length-idx:Math.max(1,Math.round(need[i]/totalNeed*rest.length));
    const chunk=rest.slice(idx,idx+take);idx+=take;if(!chunk.length)continue;
    const angs=chunk.map(ang).sort((a,b)=>a-b);const mid=angs[Math.floor(angs.length/2)];
    const main=chunk.slice().sort((x,y)=>(Math.abs(hexDist(x,[0,0])-2.6)+Math.abs(ang(x)-mid)*2)-(Math.abs(hexDist(y,[0,0])-2.6)+Math.abs(ang(y)-mid)*2))[0];
    const ordered=[main,...chunk.filter(t=>t!==main).sort((x,y)=>hexDist(x,main)-hexDist(y,main))];
    ordered.forEach((t,j)=>{if(j<need[i]){owner.set(key(t),i);region[i].push(t);}});
  }
  return {owner,region,key};
}

function search(s){
  s=s.trim().toLowerCase();if(!s){results.hidden=true;results.innerHTML='';return;}
  const hits=[];
  B.forEach(b=>{const body=[];b.secs.forEach(x=>{body.push(x.h);(x.text||[]).forEach(t=>body.push(t));x.pts.forEach(t=>body.push(t));x.pts2.forEach(t=>body.push(t));if(x.note)body.push(x.note);if(x.table)x.table.rows.forEach(r=>body.push(r.join(' ')));});
    const plain=body.map(t=>t.replace(/\*\*/g,''));let score=0,snip='';if([b.name,b.en].join(' ').toLowerCase().includes(s))score+=5;
    const m=plain.filter(x=>x.toLowerCase().includes(s));if(m.length){score+=1+Math.min(m.length,5);snip=m[0];}
    if(score)hits.push({type:'b',id:b.id,name:dn(b),snip:snip||b.en,score});});
  [...ILINKS,...LINKS].forEach(L=>{if(!lineObjs[L.id])return;const m=L.pts.map(t=>t.replace(/\*\*/g,'')).find(x=>x.toLowerCase().includes(s));if(m||L.title.toLowerCase().includes(s))hits.push({type:'l',id:L.id,name:`${L.type==='collab'?'協作線':'衝突線'}｜${L.title}`,snip:m||'',score:1});});
  hits.sort((a,b)=>b.score-a.score);results.hidden=false;
  results.innerHTML=hits.length?hits.slice(0,8).map(h=>`<li><button data-t="${h.type}" data-id="${esc(h.id)}"><b>${esc(h.name)}</b><small>${esc(h.snip)}</small></button></li>`).join(''):'<li class="none">找不到「'+esc(s)+'」</li>';
}

  else if(!(dx||dz)&&!me.arrived){me.arrived=true;}
  if(me.arrived&&me.face&&fp&&!lastLook){let fy=Math.atan2(me.face.x-me.pos.x,me.face.z-me.pos.z)-yaw;fy=Math.atan2(Math.sin(fy),Math.cos(fy));if(Math.abs(fy)<.01)me.face=null;else yaw+=fy*Math.min(1,dt*5);}
  const vx=me.pos.x-prev.x,vz=me.pos.z-prev.z;if(vx*vx+vz*vz>2e-5){{let dr=Math.atan2(vx,vz)-meAv.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));meAv.g.rotation.y+=dr*Math.min(1,dt*10);}if(fp&&!(dx||dz)&&!me.arrived){let dy=Math.atan2(vx,vz)-yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));yaw+=dy*Math.min(1,dt*4);}}
  me.pos.y+=(groundY(me.pos.x,me.pos.z)-me.pos.y)*Math.min(1,dt*10);
  meAv.g.position.set(me.pos.x,me.pos.y+(moving&&!reduce?Math.abs(Math.sin(t*10))*.06:0),me.pos.z);
  if(moving&&performance.now()-lastPush>120)push();
  if(!moving&&me.moving)push();
  me.moving=moving;
}

/* ---------- peers ---------- */
const PEERS=new Map();
function setPeerPos(e,m){
  if(typeof m.x==='number'&&typeof m.z==='number'&&isFinite(m.x)&&isFinite(m.z)){e.tgt.set(m.x,0,m.z);clampIsland(e.tgt);}
  e.at=(typeof m.at==='string'&&byId[m.at])?m.at:null;const h=m.hand===true;if(h!==e.hand){e.hand=h;e.av.hand.visible=h;renderPeerTag(e);scheduleRoster();}
}
function renderPeerTag(e){setTag(e.tag,e.name||'同學',e.hand,false,e.color,e.stars);}
function upsertPeer(p){
  if(!p||typeof p.id!=='string'||p.id===net.myKey)return;
  if(typeof p.t==='number'&&Date.now()-p.t>120000&&!PEERS.has(p.id))return;
  let e=PEERS.get(p.id);
  if(!e){const x=Number(p.x)||0,z=Number(p.z)||0;
    e={id:p.id,av:makeAvatar('#8A9499',false),cur:new THREE.Vector3(x,0,z),tgt:new THREE.Vector3(x,0,z),hand:false};
    clampIsland(e.cur);e.cur.y=groundY(e.cur.x,e.cur.z);
    e.tag=addLabel('',tagPos(e.av.g),'av',()=>{});PEERS.set(p.id,e);}
  e.t=typeof p.t==='number'?p.t:Date.now();
  e.name=cleanName(p.name)||'同學';
  e.color=colorOf(String(p.uid||p.id));e.av.body.color.set(e.color);
  e.stars=Math.max(0,Math.min(B.length,p.stars|0));
  const at0=e.at;setPeerPos(e,p);e.av.hand.visible=e.hand;renderPeerTag(e);if(e.at!==at0)scheduleRoster();
}
function removePeer(id){const e=PEERS.get(id);if(!e)return;scene.remove(e.av.g);dropLabel(e.tag);PEERS.delete(id);}
function stepPeers(dt,t){
  const k=1-Math.exp(-dt*6);
  PEERS.forEach(e=>{const px=e.cur.x,pz=e.cur.z;e.cur.x+=(e.tgt.x-e.cur.x)*k;e.cur.z+=(e.tgt.z-e.cur.z)*k;
    const vx=e.cur.x-px,vz=e.cur.z-pz,moving=Math.hypot(e.tgt.x-e.cur.x,e.tgt.z-e.cur.z)>.04;
    if(vx*vx+vz*vz>1e-7)e.av.g.rotation.y=Math.atan2(vx,vz);
    e.cur.y+=(groundY(e.cur.x,e.cur.z)-e.cur.y)*Math.min(1,dt*10);
    e.av.g.position.set(e.cur.x,e.cur.y+(moving&&!reduce?Math.abs(Math.sin(t*10+e.cur.x))*.06:0),e.cur.z);});
}

/* ---------- roster UI ---------- */
const rosterHead=document.getElementById('rosterHead'),rosterBody=document.getElementById('rosterBody'),rosterList=document.getElementById('rosterList'),
  rosterCount=document.getElementById('rosterCount'),rosterChev=document.getElementById('rosterChev'),liveDot=document.getElementById('liveDot'),
  roomNote=document.getElementById('roomNote'),handBtn=document.getElementById('handBtn'),followCk=document.getElementById('followCk'),toastEl=document.getElementById('toast');
rosterHead.addEventListener('click',()=>{const open=rosterBody.hidden;rosterBody.hidden=!open;rosterHead.setAttribute('aria-expanded',String(open));rosterChev.textContent=open?'收合':'展開';app.classList.toggle('roster-open',open);});
handBtn.addEventListener('click',()=>{me.hand=!me.hand;meAv.hand.visible=me.hand;handBtn.textContent=me.hand?'放下手':'舉手';handBtn.classList.toggle('on',me.hand);setMeTag();push();scheduleRoster();});
followCk.addEventListener('change',()=>{if(followCk.checked)farView=false;});
let toastT=0;function toast(s){toastEl.textContent=s;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,3200);}
const NOTE={on:'已連線。點名字可以把鏡頭移過去。',wait:'連線中…（網路不穩時會自動重連）',off:'目前連不上資料庫，請重新整理頁面。',solo:'單人試玩模式：網站還沒接上資料庫，看不到其他同學，星星只存在這台電腦。'};
function setRoomNote(k){roomNote.textContent=NOTE[k];liveDot.classList.toggle('on',k==='on');}
const whereText=at=>at&&byId[at]?byId[at].name:'散步中';
let rosterQueued=false;
function scheduleRoster(){if(rosterQueued)return;rosterQueued=true;setTimeout(()=>{rosterQueued=false;renderRoster();},250);}
function renderRoster(){
  rosterCount.textContent=`島上 ${PEERS.size+1} 人`;
  const mine=[...starSet].filter(id=>byId[id]).length;
  const rows=[{me:true,name:(me.name||'你')+'（你）',color:me.color,hand:me.hand,at:me.at,n:mine}];
  PEERS.forEach(e=>rows.push({e,name:e.name||'同學',color:e.color,hand:e.hand,at:e.at,n:e.stars||0}));
  rows.sort((a,b)=>(b.hand-a.hand)||(b.me?1:0)-(a.me?1:0));
  rosterList.replaceChildren(...rows.map(r=>{const li=document.createElement('li');const bt=document.createElement('button');bt.type='button';
    const sw=document.createElement('span');sw.className='sw';sw.style.background=r.color;
    const nm=document.createElement('span');nm.className='nm';nm.textContent=r.name;bt.append(sw,nm);
    if(r.hand){const h=document.createElement('span');h.className='handmark';h.textContent='舉手';bt.append(h);}
    const st=document.createElement('span');st.className='star';st.textContent='★'+r.n;bt.append(st);
    const w=document.createElement('span');w.className='where';w.textContent=whereText(r.at);bt.append(w);
    bt.addEventListener('click',()=>{if(r.me){farView=false;flyTo(meAv.g.position.clone(),7);}else{farView=true;flyTo(r.e.cur.clone(),7);}});
    li.append(bt);return li;}));
  refreshHere();
}
function refreshHere(){
  const el=document.getElementById('here');if(!el)return;const id=el.dataset.b;
  const names=[];if(me.at===id)names.push((me.name||'你')+'（你）');PEERS.forEach(e=>{if(e.at===id)names.push(e.name||'同學');});
  el.textContent=names.length?names.join('、'):'目前沒有人在這棟。';
}
document.getElementById('pwBtn').addEventListener('click',()=>openPw());
document.getElementById('logoutBtn').addEventListener('click',async()=>{
  leaveIsland();
  if(net.solo){me.name='';meAv.g.visible=false;meTag.hidden=true;showLogin('');return;}
  try{await net.auth.signOut();}catch(e){}
});

/* ---------- login ---------- */
const login=document.getElementById('login'),loginForm=document.getElementById('loginForm'),loginErr=document.getElementById('loginErr'),
  fAcct=document.getElementById('fAcct'),fName=document.getElementById('fName'),fPw=document.getElementById('fPw'),fPw2=document.getElementById('fPw2'),goBtn=document.getElementById('goBtn');
let mode='in';
function setMode(m){mode=m;
  document.querySelectorAll('#loginTabs button').forEach(b=>{const on=b.dataset.mode===m;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on));});
  document.getElementById('lName').hidden=m==='in';document.getElementById('lPw2').hidden=m!=='up';
  fPw.autocomplete=m==='up'?'new-password':'current-password';
  goBtn.textContent=m==='up'?'註冊並上島':'登入';loginErr.textContent='';
  document.getElementById('loginLead').textContent=m==='up'?'第一次來，先建立帳號。帳號用英文小寫或數字（例如學號），之後用它登入。':'用你的帳號密碼登入，星星會跟著帳號累積。';
}
document.getElementById('loginTabs').addEventListener('click',e=>{const b=e.target.closest('button[data-mode]');if(b)setMode(b.dataset.mode);});
function showLogin(msg){login.hidden=false;loginErr.textContent=msg||'';meAv.g.visible=false;meTag.hidden=true;setTimeout(()=>(net.solo?fName:(fAcct.value?fPw:fAcct)).focus(),50);}
function hideLogin(){login.hidden=true;window.scrollTo(0,0);}
if(net.solo){
  document.getElementById('loginTabs').hidden=true;document.getElementById('lAcct').hidden=true;document.getElementById('lPw').hidden=true;document.getElementById('lPw2').hidden=true;
  document.getElementById('lName').hidden=false;goBtn.textContent='單人試玩';
  document.getElementById('loginLead').textContent='網站還沒接上資料庫，目前是單人試玩：可以逛島、拿星星，但看不到其他同學。';
  document.getElementById('pwBtn').hidden=true;document.getElementById('logoutBtn').textContent='換名字';
}else setMode('in');
let regPromise=null;
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginErr.textContent='';
  if(net.solo){const name=cleanName(fName.value);if(!name){loginErr.textContent='請輸入名字。';return;}
    me.name=name;setMeColor(colorOf(name));hideLogin();if(!CUR)setIslands(Object.fromEntries((window.HTN_SEED||[]).map(x=>[x.id,normIsland(x.id,x)])));else enterIsland();return;}
  const acct=fAcct.value.trim().toLowerCase(),pw=fPw.value;
  if(!/^[a-z0-9_-]{3,20}$/.test(acct)){loginErr.textContent='帳號請用 3–20 個英文小寫、數字、- 或 _。';return;}
  if(pw.length<6){loginErr.textContent='密碼至少 6 個字元。';return;}
  goBtn.disabled=true;
  try{
    if(mode==='up'){
      const name=cleanName(fName.value);
      if(!name){loginErr.textContent='請輸入使用者名稱。';return;}
      if(acct===TEACHER){loginErr.textContent='這個帳號保留給老師使用，請換一個。';return;}
      if(pw!==fPw2.value){loginErr.textContent='兩次輸入的密碼不一樣。';return;}
      loginErr.textContent='建立帳號中…';
      let done;regPromise=new Promise(res=>done=res);
      try{await net.auth.createUserWithEmailAndPassword(acctEmail(acct),pw);await net.db.ref('users/'+acct).set({name,created:Date.now(),last:Date.now()});}finally{done();}
    }else{
      loginErr.textContent='登入中…';
      await net.auth.signInWithEmailAndPassword(acctEmail(acct),pw);
    }
    fPw.value='';fPw2.value='';
  }catch(err){regPromise=null;loginErr.textContent=authMsg(err);}
  finally{goBtn.disabled=false;}
});

/* ---------- camera helpers ---------- */
canvas.addEventListener('pointerdown',e=>{if(e.button===2||e.ctrlKey||e.metaKey||e.shiftKey)farView=true;});
canvas.addEventListener('touchstart',e=>{if(e.touches.length>=2)farView=true;},{passive:true});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('camBtn').addEventListener('click',()=>{if(!CUR)return;
  if(fp){if(VOY&&VOY.ins&&(VOY.phase==='inspect'||VOY.phase==='deny')){const p=VOY.ins.position;yaw=Math.atan2(p.x-me.pos.x,p.z-me.pos.z);pitch=.05;}
    else if(VOY){VOY.off=0;pitch=-.12;}else{pitch=-.08;}return;}
  farView=false;followCk.checked=true;const tp=meAv.g.position.clone();if(!VOY)tp.setY(TOP);flyTo(tp,9);});

/* ---------- boot ---------- */
if(ONLINE){
  firebase.initializeApp(CFG);net.auth=firebase.auth();net.db=firebase.database();
  net.db.ref('.info/connected').on('value',s=>{
    if(s.val()===true){net.ready=true;if(net.pres){net.pres.onDisconnect().remove();net.pres.set(myPresence()).catch(()=>{});}setRoomNote('on');}
    else{net.ready=false;setRoomNote('wait');}});
  net.auth.onAuthStateChanged(async u=>{
    if(!u){
      if(net.contentOff){net.contentOff();net.contentOff=null;}
      leaveIsland();net.uid=net.acct=null;net.isTeacher=false;me.name='';CUR=null;
      if(world){scene.remove(world);disposeGroup(world);world=null;}dynLabels.forEach(dropLabel);dynLabels=[];pick=[...staticPick];
      document.getElementById('adminLink').hidden=true;hidePanel();hideNoIsland();showLogin('');return;}
    const acct=emailAcct(u.email);
    if(!acct){await net.auth.signOut();showLogin('這個帳號不屬於本網站。');return;}
    if(regPromise){try{await regPromise;}catch(e){}regPromise=null;}
    net.uid=u.uid;net.acct=acct;net.isTeacher=acct===TEACHER;
    document.getElementById('adminLink').hidden=!net.isTeacher;
    let name='';try{const s=await net.db.ref('users/'+acct).get();name=s.exists()&&s.val().name||'';}catch(e){}
    me.name=cleanName(name)||(net.isTeacher?'老師':acct);setMeColor(colorOf(u.uid));
    net.db.ref('users/'+acct+'/last').set(Date.now()).catch(()=>{});
    hideLogin();setMeTag();
    const ref=net.db.ref('content/islands');
    const fn=s=>{const v=s.val()||{};setIslands(Object.fromEntries(Object.keys(v).map(k=>[k,normIsland(k,v[k])])));};
    ref.on('value',fn,err=>{toast('讀取島嶼失敗：'+err.message);});net.contentOff=()=>ref.off('value',fn);
  });
}else{
  setRoomNote('solo');
  me.name='';setMeColor('#A9545D');hideLogin();
  setIslands(Object.fromEntries((window.HTN_SEED||[]).map(x=>[x.id,normIsland(x.id,x)])));
  renderRescue();document.getElementById('rescueNow').addEventListener('click',()=>{if(RS.active){openRescue();}else{RS.timer=0;}});
  if(CUR){const c0=tileCenters[0],c1=tileCenters[1]||c0.clone().add(new THREE.Vector3(1,0,0));const u=c1.clone().sub(c0).setY(0).normalize();
    me.pos.set(c0.x+u.x*1.5,TOP,c0.z+u.z*1.5);me.tgt.copy(me.pos);meAv.g.rotation.y=Math.atan2(u.x,u.z);setFP(true);yaw=Math.atan2(u.x,u.z);pitch=-.08;
    if(innerWidth<760)hidePanel();}
}

/* ===================== LOOP ===================== */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=fp?fpBaseFov():(w<760?52:42);camera.near=fp?.02:.1;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let figA=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(timeMode==='auto')phase=(phase+dt/(reduce?600:150))%1;
  else{const target=timeMode==='day'?.25:.75;phase+=((target-phase+1.5)%1-.5)*Math.min(1,dt*2);phase=(phase+1)%1;}
  applySky(phase);
  if(!reduce){animated.forEach(f=>f(t));clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>65)c.position.x=-65;});}
  fig.visible=!!world;
  if(world){stepNPCs(dt,t);if(!VOY)stepRescue(dt,t);stepVoyage(dt,t);}stepBirds(reduce?0:t);
  Object.values(lineObjs).forEach((o,li)=>{o.dots.forEach((d,i)=>{const k=((reduce?0:t*.05)+i/3+li*.13)%1;const u=o.type==='conflict'?1-k:k;d.position.copy(o.curve.getPoint(u));const tg=o.curve.getTangent(u);if(o.type==='conflict')tg.negate();d.rotation.y=Math.atan2(tg.x,tg.z);d.position.y+=Math.abs(Math.sin(t*9+i))*.03;});});
  selRing.rotation.z+=dt*.6;
  WIND.value=t;if(!reduce){TEX.water.offset.y=(t*.03)%1;TEX.sea.offset.x=(t*.004)%1;}skyDome.position.copy(camera.position);
  stepMe(dt,t);stepPeers(dt,t);
  if(fp&&CUR&&(mmTick++&1)===0)drawMinimap();
  if(CUR){if(!fp)meAv.g.visible=true;meTag.hidden=fp;}
  if(fp){const bob=me.moving&&!reduce?Math.sin(t*9)*.012:0;zC+=(zT-zC)*Math.min(1,dt*10);
    const fx=Math.sin(yaw)*Math.cos(pitch),fy=Math.sin(pitch),fz=Math.cos(yaw)*Math.cos(pitch);camera.position.set(me.pos.x,me.pos.y+EYE+bob,me.pos.z);
    v3.set(me.pos.x+fx,me.pos.y+EYE+bob+fy,me.pos.z+fz);camera.lookAt(v3);
    const tf=fpBaseFov()*(zC<0?1+zC*.6:1+zC*.3);if(Math.abs(camera.fov-tf)>.05){camera.fov=tf;camera.updateProjectionMatrix();}
    meAv.g.visible=false;}
  else if(followCk.checked&&!farView&&!fly&&CUR){const d=v3.copy(meAv.g.position).setY(VOY?meAv.g.position.y:TOP).sub(controls.target).multiplyScalar(Math.min(1,dt*3));controls.target.add(d);camera.position.add(d);}
  if(fly){const k=Math.min(1,(performance.now()-fly.t0)/fly.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(fly.fromT,fly.toT,e);camera.position.lerpVectors(fly.fromP,fly.toP,e);if(k>=1)fly=null;}
  if(!fp){{const lim=BEACH?BEACH.R+30:24;if(controls.target.length()>lim)controls.target.setLength(lim);}controls.update();}renderer.render(scene,camera);placeLabels();requestAnimationFrame(frame);
}
frame();
